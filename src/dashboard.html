<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoeLink Gateway Dashboard</title>
<style>
  :root { color-scheme: dark; --bg:#0f1218; --card:#181d27; --line:#262d3b; --fg:#e6e9ef; --dim:#8b93a5; --ok:#3ecf8e; --bad:#ff5d6c; --warn:#f5b342; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:12px; padding:14px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; flex:1; }
  header small { color:var(--dim); }
  button, input { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font:inherit; }
  button { cursor:pointer; }
  main { padding:20px 24px; display:grid; gap:20px; max-width:1200px; margin:0 auto; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .name { font-weight:600; }
  .dim { color:var(--dim); font-size:12px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:var(--dim); }
  .up .dot, .tag.ok { background:var(--ok); } .down .dot { background:var(--bad); }
  .tag { padding:1px 8px; border-radius:10px; font-size:12px; color:#0b0e13; background:var(--dim); }
  .tag.ok { background:var(--ok); } .tag.behind { background:var(--warn); } .tag.bad { background:var(--bad); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; font-size:12px; } tr:last-child td { border-bottom:0; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  code { font-family:ui-monospace,Menlo,monospace; }
  a { color:#7cb7ff; text-decoration:none; }
  .bars { display:flex; align-items:flex-end; gap:2px; height:80px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .bars div { flex:1; background:#4c8dff; min-height:1px; border-radius:2px 2px 0 0; }
  #err { color:var(--bad); }
  #login-view { max-width:420px; margin-top:12vh; }
  #login-form { display:grid; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; }
  #login-form input { width:100%; }
  #login-form button { justify-self:start; }
</style>
</head>
<body>
<header>
  <h1>MoeLink Gateway</h1>
  <span id="err"></span>
  <small id="upd"></small>
  <span id="who" class="dim"></span>
  <button id="logout" hidden>Logout</button>
</header>

<main id="login-view" hidden>
  <section>
    <h2>Admin login</h2>
    <form id="login-form">
      <input id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
    <p class="dim">使用 MoeLink 统一账号登录，仅管理员可访问。</p>
  </section>
</main>

<main id="app-view" hidden>
  <section><h2>Services</h2><div class="grid" id="services"></div></section>
  <section><h2>Releases</h2><table id="releases"></table></section>
  <section><h2>Requests (last 24h, all services)</h2><div class="bars" id="bars"></div></section>
  <section><h2>API traffic</h2><table id="routes"></table></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const TOKEN_KEY = 'gw_jwt';
const token = () => localStorage.getItem(TOKEN_KEY) || '';
const setToken = (t) => (t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY));

function showLogin(message = '') {
  $('login-view').hidden = false;
  $('app-view').hidden = true;
  $('logout').hidden = true;
  $('who').textContent = '';
  $('err').textContent = message;
}

function showApp(me) {
  $('login-view').hidden = true;
  $('app-view').hidden = false;
  $('logout').hidden = false;
  $('who').textContent = me.email || '';
  $('err').textContent = '';
}

async function api(p, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (token()) headers.authorization = 'Bearer ' + token();
  const r = await fetch(p, { ...opts, headers });
  if (r.status === 401) {
    setToken('');
    showLogin('请先登录');
    throw new Error('请先登录');
  }
  if (r.status === 403) {
    setToken('');
    showLogin('需要管理员权限');
    throw new Error('需要管理员权限');
  }
  if (!r.ok) throw new Error(p + ' → HTTP ' + r.status);
  return r.json();
}

const ago = (iso) => { const s = Math.max(0, (Date.now() - new Date(iso)) / 1000); return s < 90 ? Math.round(s) + 's' : s < 5400 ? Math.round(s/60) + 'm' : s < 129600 ? Math.round(s/3600) + 'h' : Math.round(s/86400) + 'd'; };

function renderServices(d) {
  $('services').innerHTML = Object.entries(d).map(([n, s]) => `
    <div class="card ${s.up ? 'up' : 'down'}">
      <div class="row"><span class="name"><span class="dot"></span>${esc(n)}</span><span class="tag ${s.up ? 'ok' : 'bad'}">${s.up ? 'UP' : 'DOWN'}</span></div>
      <div class="dim">${s.up ? 'up' : 'down'} for ${ago(s.since)} · ${s.latencyMs ?? '-'} ms</div>
      ${s.lastError ? `<div class="dim" style="color:var(--bad)">${esc(s.lastError)}</div>` : ''}
    </div>`).join('');
}

function renderReleases(d) {
  const rows = d.releases.map((r) => {
    const cls = r.status === 'up-to-date' ? 'ok' : r.status === 'behind' ? 'behind' : r.error ? 'bad' : '';
    const label = r.status === 'behind' ? `behind by ${r.behindBy}` : r.status;
    const sha = r.deployedSha ? `<a href="https://github.com/${esc(r.repo)}/commit/${esc(r.deployedSha)}" target="_blank"><code>${esc(r.deployedShort)}</code></a>` : '-';
    const latest = r.latestSha ? `<code>${esc(r.latestShort)}</code> <span class="dim">${esc(r.latestMessage)}</span>` : '-';
    return `<tr><td>${esc(r.service)}</td><td>${sha}${r.version ? ` <span class="dim">v${esc(r.version)}</span>` : ''}</td>
      <td>${latest}<div class="dim">${esc(r.repo)}@${esc(r.branch)}</div></td>
      <td><span class="tag ${cls}">${esc(label)}</span>${r.error || r.githubError ? `<div class="dim">${esc(r.error || r.githubError)}</div>` : ''}</td></tr>`;
  }).join('');
  $('releases').innerHTML = `<tr><th>Service</th><th>Deployed</th><th>Latest on GitHub</th><th>Status</th></tr>${rows || '<tr><td colspan=4 class="dim">No services have a "release" config</td></tr>'}`;
}

function renderStats(d) {
  const hours = [];
  for (let i = 23; i >= 0; i--) hours.push(new Date(Date.now() - i * 3600e3).toISOString().slice(0, 13));
  const vals = hours.map((h) => Object.values(d.hourly[h] || {}).reduce((a, b) => a + b, 0));
  const max = Math.max(1, ...vals);
  $('bars').innerHTML = vals.map((v, i) => `<div style="height:${v / max * 100}%" title="${hours[i]}:00Z — ${v}"></div>`).join('');
  const rows = d.routes.sort((a, b) => b.count - a.count).map((r) => `<tr><td>${esc(r.service)}</td><td><code>${esc(r.route)}</code></td>
    <td class="n">${r.count}</td><td class="n">${r.s2xx}</td><td class="n">${r.s4xx}</td><td class="n">${r.s5xx + r.errors}</td><td class="n">${r.avgMs}</td><td class="n">${r.maxMs}</td><td class="dim">${r.last ? ago(r.last) + ' ago' : ''}</td></tr>`).join('');
  $('routes').innerHTML = `<tr><th>Service</th><th>Route</th><th class="n">Total</th><th class="n">2xx</th><th class="n">4xx</th><th class="n">5xx/err</th><th class="n">avg ms</th><th class="n">max ms</th><th>Last</th></tr>${rows || '<tr><td colspan=9 class="dim">No traffic yet</td></tr>'}`;
}

async function refresh() {
  try {
    const [s, r, st] = await Promise.all([api('/_gateway/services'), api('/_gateway/releases'), api('/_gateway/stats')]);
    renderServices(s); renderReleases(r); renderStats(st);
    $('err').textContent = ''; $('upd').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) { $('err').textContent = e.message; }
}

async function boot() {
  if (!token()) return showLogin();
  try {
    const me = await api('/_gateway/me');
    showApp(me);
    await refresh();
  } catch (e) {
    if (e.message !== '请先登录' && e.message !== '需要管理员权限') showLogin(e.message);
  }
}

$('login-form').onsubmit = async (e) => {
  e.preventDefault();
  $('err').textContent = '';
  try {
    const r = await fetch('/_gateway/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || '登录失败');
    setToken(data.token);
    $('password').value = '';
    await boot();
  } catch (e) {
    $('err').textContent = e.message;
  }
};

$('logout').onclick = () => { setToken(''); showLogin(); };

boot();
setInterval(() => { if (token() && !$('app-view').hidden) refresh(); }, 15000);
</script>
</body>
</html>
